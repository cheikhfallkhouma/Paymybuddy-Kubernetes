apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paymybuddy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tonuser/paymybuddy-k8s.git  # <-- ton repo Git ici
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: paymybuddy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
