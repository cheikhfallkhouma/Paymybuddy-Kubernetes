apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymybuddy-app
  namespace: paymybuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymybuddy-app
  template:
    metadata:
      labels:
        app: paymybuddy-app
    spec:
      initContainers:
        - name: init-db
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."
              until mysqladmin ping -h mysql.paymybuddy.svc.cluster.local -P 3306 --silent; do
                sleep 2
              done
              echo "Running init script..."
              mysql -h mysql.paymybuddy.svc.cluster.local -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" < /scripts/init.sql
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: db-init-scripts
              mountPath: /scripts
      containers:
        - name: paymybuddy-container
          image: rootcfk/paymybuddy-k8s-jenkins:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.paymybuddy.svc.cluster.local:3306/db_paymybuddy
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10 # Kubernetes attend 10 secondes après le démarrage du conteneur avant de commencer les vérifications.
            periodSeconds: 5 # Kubernetes effectue la vérification tous les 5 secondes.
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: db-init-scripts
          configMap:
            name: db-init-scripts-configmap


